[vars]
harness_repo_root = "{{ config_root | dirname | canonicalize }}"

[dotfiles."AGENTS.md"]
source = "AGENTS.md.tera"
mode = "template"
permissions = "0644"
variants = [
  { default = true, target = "{{ cwd }}/AGENTS.md" },
]

[tasks."harness:load"]
tags = ["agent"]
description = "Update shared harness"
dir = "{{ vars.harness_project_root }}"
run = '''
set -eu

if [ {{ vars.harness_repo_root | quote }} = {{ vars.harness_project_root | quote }} ]; then
  exit 0
fi

mise bootstrap repos update --yes {{ vars.harness_repo_root | quote }}
'''

[tasks."harness:agents.md:generate"]
tags = ["agent"]
description = "Regenerate AGENTS.md"
dir = "{{ vars.harness_project_root }}"
depends = ["harness:specs:install"]
run = [
  'python3 {{ vars.harness_repo_root | quote }}/bin/validate-agents-md-fragments.py',
  'mise dot apply --yes {{ vars.harness_project_root | quote }}/AGENTS.md',
  '''
generated_agents="$(cog -d {{ vars.harness_project_root | quote }}/AGENTS.md)" &&
printf '%s\n' "$generated_agents" > {{ vars.harness_project_root | quote }}/AGENTS.md
''',
]

[tasks."harness:skills:install"]
tags = ["agent"]
description = "Install shared harness skills"
dir = "{{ vars.harness_project_root }}"
env = { HARNESS_SKILLS = '{{ read_toml(path=vars.harness_project_root ~ "/.harness/config.toml")["skills"] | default(value=[]) | join(sep="\n") }}' }
run = '''
set -eu

if [ {{ vars.harness_repo_root | quote }} = {{ vars.harness_project_root | quote }} ]; then
  exit 0
fi

mkdir -p .agents/skills

printf '%s\n' "$HARNESS_SKILLS" |
  rsync --archive --recursive --itemize-changes \
    --files-from=- \
    -- \
    {{ vars.harness_repo_root | quote }}/.agents/skills/ \
    .agents/skills/
'''

[tasks."harness:specs:install"]
tags = ["agent"]
description = "Install selected shared harness specifications"
dir = "{{ vars.harness_project_root }}"
env = { HARNESS_SPECS = '{{ read_toml(path=vars.harness_project_root ~ "/.harness/config.toml")["specs"] | default(value=[]) | join(sep="\n") }}' }
run = '''
set -eu

if [ {{ vars.harness_repo_root | quote }} = {{ vars.harness_project_root | quote }} ]; then
  exit 0
fi

mkdir -p specs

printf '%s\n' "$HARNESS_SPECS" |
  rsync --archive --relative --itemize-changes \
    --files-from=- \
    -- \
    {{ vars.harness_repo_root | quote }}/specs/ \
    specs/
'''

[tasks."harness:codex:generate"]
description = "Generate Codex configuration"
dir = "{{ vars.harness_project_root }}"
run = '''
python3 - {{ vars.harness_repo_root | quote }} {{ vars.harness_project_root | quote }} <<'PY'
import datetime
import json
import sys
import tomllib
from pathlib import Path


# TODO: Replace this custom TOML serializer with Tomli-W (tomli_w.dumps).
def as_toml(value):
    if isinstance(value, str):
        return json.dumps(value, ensure_ascii=False).replace("\x7f", "\\u007f")
    if isinstance(value, bool):
        return str(value).lower()
    if isinstance(value, (int, float)):
        return repr(value)
    if isinstance(value, (datetime.date, datetime.time)):
        return value.isoformat()
    if isinstance(value, list):
        return "[" + ", ".join(as_toml(item) for item in value) + "]"
    return "{ " + ", ".join(as_toml(key) + " = " + as_toml(item) for key, item in value.items()) + " }"


harness_root = Path(sys.argv[1]).resolve()
project_root = Path(sys.argv[2]).resolve()
source = Path(".harness/codex/config.toml")
config = tomllib.loads((harness_root / source).read_text(encoding="utf-8"))
if project_root != harness_root:
    config.update(tomllib.loads((project_root / source).read_text(encoding="utf-8")))

content = "# Generated by mise run harness:codex:generate.\n# Edit .harness/codex/config.toml and regenerate.\n"
content += "".join(as_toml(key) + " = " + as_toml(value) + "\n" for key, value in config.items())
tomllib.loads(content)
destination = project_root / ".codex/config.toml"
destination.parent.mkdir(parents=True, exist_ok=True)
destination.write_text(content, encoding="utf-8")
with destination.open("rb") as written_config:
    tomllib.load(written_config)
PY
'''

[tasks."harness:generate"]
tags = ["agent"]
description = "Regenerate harness"
dir = "{{ vars.harness_project_root }}"
depends = [
  "harness:agents.md:generate",
  "harness:codex:generate",
  "harness:skills:install"
]

[tasks."harness:initialize"]
description = "Initialize harness"
dir = "{{ vars.harness_project_root }}"
run = [
  "mise run harness:load",
  "mise run harness:generate"
]
