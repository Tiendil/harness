version = 1

[[relations]]
id = "governed_by"
description = "Specifications that apply to the artifact."

[[relations]]
id = "governs"
description = "Specifications governed by the meta specification."

[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "@/specs/**/*.md" }
output = { type = "list", artifacts = ["@/specs/meta/content.md", "@/specs/meta/format.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/meta/content.md", "@/specs/meta/format.md"] }
output = { type = "files", pattern = "@/specs/**/*.md" }
