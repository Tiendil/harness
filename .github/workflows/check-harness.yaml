name: Harness check
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check-harness:
    timeout-minutes: 10
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: '2026.11.8'
          install: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Check harness source lock
        run: mise run harness:lock:check
